<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" fill="none" role="img" aria-labelledby="t d"><title id="t">Signals</title><desc id="d">Five headline metrics with animated reveal.</desc><defs></defs><style>@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@media (prefers-reduced-motion: no-preference){
  .st { animation: stin .5s ease-out backwards; }
  @keyframes stin { from { opacity:0; transform: translateY(8px); }
                    to   { opacity:1; transform: translateY(0); } }
  .bar { transform-origin: left center; animation: grow 1.1s ease-out backwards; }
