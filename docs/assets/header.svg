<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="t d"><title id="t">Ari Miyanji - AI research and development</title><desc id="d">Animated KONKRED-branded profile header with the Cube-K mark.</desc><defs></defs><style>@media (prefers-reduced-motion: no-preference){
  .scanband  { animation: scanY 4s linear infinite; }
  .scanband2 { animation: scanY 4s linear infinite; opacity:.5; }
  @keyframes scanY { from { transform: translateY(0); } to { transform: translateY(300px); } }
  .kedge { animation: kglow 3.3s ease-in-out infinite; }
  @keyframes kglow { 0%,100% { opacity:.30; } 50% { opacity:.78; } }
  .trace { stroke-dasharray: 16 10; animation: drift 11.5s linear infinite; }
  @keyframes drift { to { stroke-dashoffset: -260; } }
  .sigdot { animation: sig 2.4s ease-in-out infinite; }
  @keyframes sig { 0%,100% { opacity:.35; } 50% { opacity:1; } }

  .rise { animation: rise .5s ease-out backwards; }
  @keyframes rise { from { opacity:0; transform: translateY(7px); }
                     to   { opacity:1; transform: translateY(0); } }
  .cube { animation: rise .7s ease-out .05s backwards; }
  .r0 { animation-delay:.10s } .r1 { animation-delay:.22s }
  .r2 { animation-delay:.34s } .r3 { animation-delay:.46s }
  .r4 { animation-delay:.58s } .r5 { animation-delay:.70s }
  .rot { animation: rot 15s linear infinite; }
  @keyframes rot {
     0%   { opacity:0; transform: translateY(6px); }
     2.5% { opacity:1; transform: translateY(0); }
    22.5% { opacity:1; transform: translateY(0); }
    25%   { opacity:0; transform: translateY(-6px); }
   100%   { opacity:0; transform: translateY(-6px); } }
  .k0 { animation-delay:.9s } .k1 { animation-delay:4.65s }
  .k2 { animation-delay:8.4s } .k3 { animation-delay:12.15s }
  .rail { stroke-dasharray: 200 900; animation: railrun 9s linear infinite; }
  @keyframes railrun { to { stroke-dashoffset: -1100; } }
  .live { animation: sig 2.4s ease-in-out infinite; }
  .caret { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
}</style><rect width="1200" height="340" fill="#0B0F14"/><defs><pattern id="hg" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D7D9DD" stroke-width="1" opacity="0.022"/></pattern></defs><rect width="1200" height="340" fill="url(#hg)"/><rect x="0" y="0" width="1200" height="340" fill="none" stroke="#1A212B" stroke-width="1"/><line x1="14" y1="14" x2="26" y2="14" stroke="#D98A2E" stroke-width="1.1" opacity=".55"/><line x1="14" y1="14" x2="14" y2="26" stroke="#D98A2E" stroke-width="1.1" opacity=".55"/><line x1="1186" y1="14" x2="1174" y2="14" stroke="#D98A2E" stroke-width="1.1" opacity=".55"/><line x1="1186" y1="14" x2="1186" y2="26" stroke="#D98A2E" stroke-width="1.1" opacity=".55"/><line x1="14" y1="326" x2="26" y2="326" stroke="#D98A2E" stroke-width="1.1" opacity=".55"/><line x1="14" y1="326" x2="14" y2="314" stroke="#D98A2E" stroke-width="1.1" opacity=".55"/><line x1="1186" y1="326" x2="1174" y2="326" stroke="#D98A2E" stroke-width="1.1" opacity=".55"/><line x1="1186" y1="326" x2="1186" y2="314" stroke="#D98A2E" stroke-width="1.1" opacity=".55"/><defs><clipPath id="hkcut"><path d="M 116.02,115.75 L 129.88,107.75 L 129.88,134.75 L 151.96,95.00 L 169.72,84.75 L 143.30,135.00 L 171.45,153.75 L 153.00,164.40 L 129.88,149.25 L 129.88,177.75 L 116.02,185.75 Z"/></clipPath><clipPath id="hsil"><path d="M 100.00,10.00 L 186.60,60.00 L 186.60,160.00 L 100.00,210.00 L 13.40,160.00 L 13.40,60.00 Z"/></clipPath><linearGradient id="hscan" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D98A2E" stop-opacity="0"/><stop offset="50%" stop-color="#D98A2E" stop-opacity=".5"/><stop offset="100%" stop-color="#D98A2E" stop-opacity="0"/></linearGradient></defs><g transform="translate(52,58) scale(0.8)" class="cube"><path d="M 100.00,10.00 L 186.60,60.00 L 100.00,110.00 L 13.40,60.00 Z" fill="#E8E9EC"/><path d="M 13.40,60.00 L 100.00,110.00 L 100.00,210.00 L 13.40,160.00 Z" fill="#D7D9DD"/><path d="M 100.00,110.00 L 186.60,60