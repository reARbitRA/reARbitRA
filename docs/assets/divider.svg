<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="22" viewBox="0 0 1200 22" fill="none" role="img" aria-labelledby="t d"><title id="t">Divider</title><desc id="d">Hazard tape divider with a running red charge.</desc><defs><filter id="dgrain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.957  0 0 0 0 0.945  0 0 0 0 0.921  0.34 0.34 0.34 0 -0.16"/></filter><filter id="dsoft" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.90  0 0 0 0 0.89  0 0 0 0 0.87  0.22 0.22 0.22 0 -0.11"/></filter><radialGradient id="dbreath" cx="15%" cy="10%" r="95%"><stop offset="0%" stop-color="#ffffff" stop-opacity=".035"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/></radialGradient><radialGradient id="dheat" cx="90%" cy="90%" r="90%"><stop offset="0%" stop-color="#d60019" stop-opacity=".07"/><stop offset="60%" stop-color="#d60019" stop-opacity="0"/></radialGradient><pattern id="dscan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#ffffff" opacity=".015"/></pattern><pattern id="dbp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d60019" stroke-width="1" opacity=".10"/></pattern><pattern id="dhz" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#0a0908"/><rect width="9" height="18" fill="#d60019"/></pattern><linearGradient id="dpan" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#171514"/><stop offset="100%" stop-color="#0c0b0a"/></linearGradient><radialGradient id="driv" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#f4f1eb"/><stop offset="55%" stop-color="#8a857d"/><stop offset="100%" stop-color="#262221"/></radialGradient><linearGradient id="dflood" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#d60019" stop-opacity=".30"/><stop offset="100%" stop-color="#d60019" stop-opacity="0"/></linearGradient><linearGradient id="dbeam" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff1a2e" stop-opacity="0"/><stop offset="50%" stop-color="#ff1a2e" stop-opacity=".30"/><stop offset="100%" stop-color="#ff1a2e" stop-opacity="0"/></linearGradient></defs><style>@media (prefers-reduced-motion: no-preference){
  .grain { animation: grainflick .9s steps(3) infinite; }
  @keyframes grainflick {
      0%   { transform: translate(0,0); }
     33%   { transform: translate(-40px,30px); }
     66%   { transform: translate(30px,-45px); }
    100%   { transform: translate(0,0); } }

  .charge { animation: charge 5s linear infinite; }
  @keyframes charge { 0% { opacity:0; transform: translateX(0) }
                      8% { opacity:1 } 88% { opacity:1 }
                      100% { opacity:0; transform: translateX(1150px) } }
  .dtick { animation: dtick 3.2s ease-in-out infinite; }
  @keyframes dtick { 0%,100% { opacity:.3 } 50% { opacity:.9 } }
}</style><rect width="1200" height="22" fill="#0a0908"/><rect x="0" y="9" width="1200" height="4" fill="url(#dhz)"/><rect class="dtick" x="24" y="4" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.00s"/><rect class="dtick" x="24" y="13" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.00s"/><rect class="dtick" x="120" y="4" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.16s"/><rect class="dtick" x="120" y="13" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.16s"/><rect class="dtick" x="216" y="4" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.32s"/><rect class="dtick" x="216" y="13" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.32s"/><rect class="dtick" x="312" y="4" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.48s"/><rect class="dtick" x="312" y="13" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.48s"/><rect class="dtick" x="408" y="4" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.64s"/><rect class="dtick" x="408" y="13" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.64s"/><rect class="dtick" x="504" y="4" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.80s"/><rect class="dtick" x="504" y="13" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.80s"/><rect class="dtick" x="600" y="4" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.96s"/><rect class="dtick" x="600" y="13" width="1.5" height="5" fill="#5c5852" style="animation-delay:0.96s"/><rect class="dtick" x="696" y="4" width="1.5" height="5" fill="#5c5852" style="animation-delay:1.12s"/><rect class="dtick" x="696" y="13" width="1.5" height="5" fill="#5c5852" style="animation-delay:1.12s"/><rect class="dtick" x="792" y="4" width="1.5" height="5" fill="#5c5852" style="animation-delay:1.28s"/><rect class="dtick" x="792" y="13" width="1.5" height="5" fill="#5c5852" style="animation-delay:1.28s"/><rect class="dtick" x="