}</style><rect width="1200" height="589" fill="#0B0F14"/><line x1="26" y1="0" x2="26" y2="589" stroke="#1A212B" stroke-width="1"/><line class="rail" x1="26" y1="0" x2="26" y2="589" stroke="#D98A2E" stroke-width="1.6"/><g class="row" style="animation-delay:0.05s" transform="translate(0,0)"><rect x="20" y="38.0" width="12" height="12" fill="#0B0F14" stroke="#222B36" stroke-width="1"/><rect class="node" x="23" y="41.0" width="6" height="6" fill="#D98A2E" style="animation-delay:0.00s"/><rect x="56.5" y="0.5" width="1143" height="87" fill="#0D1218" stroke="#1A212B" stroke-width="1" rx="3"/><text x="78" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="16.5" font-weight="500" fill="#E8E9EC" text-anchor="start" letter-spacing="-0.1">KONKRED Audit</text><text x="78" y="62" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#9AA0A8" text-anchor="start">Prompt certification engine. Seven mathematical and logical formulas for valuation, accuracy scoring and certification of AI intellectual property.</text><text x="1174" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="500" fill="#D98A2E" text-anchor="end" letter-spacing="2.2">LIVE</text></g><g class="row" style="animation-delay:0.15s" transform="translate(0,100)"><rect x="20" y="38.0" width="12" height="12" fill="#0B0F14" stroke="#222B36" stroke-width="1"/><rect class="node" x="23" y="41.0" width="6" height="6" fill="#D98A2E" style="animation-delay:0.45s"/><rect x="56.5" y="0.5" width="1143" height="87" fill="#0D1218" stroke="#1A212B" stroke-width="1" rx="3"/><text x="78" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="16.5" font-weight="500" fill="#E8E9EC" text-anchor="start" letter-spacing="-0.1">KONKRED Enterprise</text><text x="78" y="62" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#9AA0A8" text-anchor="start">Micro-tool marketplace. 500+ industrial-grade prompts across 10+ strategic domains, converted into autonomous agents via the Genesis Engine architecture.</text><text x="1174" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="500" fill="#D98A2E" text-anchor="end" letter-spacing="2.2">LIVE</text></g><g class="row" style="animation-delay:0.25s" transform="translate(0,200)"><rect x="20" y="38.0" width="12" height="12" fill="#0B0F14" stroke="#222B36" stroke-width="1"/><rect class="node" x="23" y="41.0" width="6" height="6" fill="#D98A2E" style="animation-delay:0.90s"/><rect x="56.5" y="0.5" width="1143" height="87" fill="#0D1218" stroke="#1A212B" stroke-width="1" rx="3"/><text x="78" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="16.5" font-weight="500" fill="#E8E9EC" text-anchor="start" letter-spacing="-0.1">KONKRED Redeye</text><text x="78" y="62" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#9AA0A8" text-anchor="start">LLM red-team platform in TypeScript and React. 367 adversarial techniques catalogued; defensive layers against prompt injection and data leakage.</text><text x="1174" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="500" fill="#D98A2E" text-anchor="end" letter-spacing="2.2">LIVE</text></g><g class="row" style="animation-delay:0.35s" transform="translate(0,300)"><rect x="20" y="38.0" width="12" height="12" fill="#0B0F14" stroke="#222B36" stroke-width="1"/><rect class="node" x="23" y="41.0" width="6" height="6" fill="#D98A2E" style="animation-delay:1.35s"/><rect x="56.5" y="0.5" width="1143" height="87" fill="#0D1218" stroke="#1A212B" stroke-width="1" rx="3"/><text x="78" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="16.5" font-weight="500" fill="#E8E9EC" text-anchor="start" letter-spacing="-0.1">KONKRED Arbitra</text><text x="78" y="62" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#9AA0A8" text-anchor="start">Documentation engine. API references, runbooks and architecture notes generated from code and prompts, then verified and versioned.</text><text x="1174" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="500" fill="#D98A2E" text-anchor="end" letter-spacing="2.2">LIVE</text></g><g class="row" style="animation-delay:0.45s" transform="translate(0,400)"><rect x="20" y="38.0" width="12" height="12" fill="#0B0F14" stroke="#222B36" stroke-width="1"/><rect class="node" x="23" y="41.0" width="6" height="6" fill="#D98A2E" style="animation-delay:1.80s"/><rect x="56.5" y="0.5" width="1143" height="87" fill="#0D1218" stroke="#1A212B" stroke-width="1" rx="3"/><text x="78" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="16.5" font-weight="500" fill="#E8E9EC" text-anchor="start" letter-spacing="-0.1">AI economics restructure</text><text x="78" y="62" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#9AA0A8" text-anchor="start">Reverse-engineered COGS for large-scale Gemini deployments. Context management and caching strategy cut spend from $20,000 to $6,000.</text><text x="1174" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="500" fill="#6B717A" text-anchor="end" letter-spacing="2.2">SHIPPED</text></g><g class="row" style="animation-delay:0.55s" transform="translate(0,500)"><rect x="20" y="38.0" width="12" height="12" fill="#0B0F14" stroke="#222B36" stroke-width="1"/><rect class="node" x="23" y="41.0" width="6" height="6" fill="#D98A2E" style="animation-delay:2.25s"/><rect x="56.5" y="0.5" width="1143" height="87" fill="#0D1218" stroke="#1A212B" stroke-width="1" rx="3"/><text x="78" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="16.5" font-weight="500" fill="#E8E9EC" text-anchor="start" letter-spacing="-0.1">Brand system v2</text><text x="78" y="62" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#9AA0A8" text-anchor="start">Full identity, motion spec and static production site. No framework, sub-12KB JS, first paint under 1.2s.</text><text x="1174" y="34" font-family="'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="500" fill="#6B717A" text-anchor="end" letter-spacing="2.2">SHIPPED</text></g></svg>