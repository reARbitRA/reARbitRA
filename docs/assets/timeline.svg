<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="589" viewBox="0 0 1200 589" fill="none" role="img" aria-labelledby="t d"><title id="t">Build log</title><desc id="d">Timeline of shipped systems.</desc><defs></defs><style>@font-face{font-family:'Inter';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@media (prefers-reduced-motion: no-preference){
  .row { animation: rin .5s ease-out backwards; }
