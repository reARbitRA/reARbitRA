11" font-weight="400" fill="#6B717A" text-anchor="start" letter-spacing="3.2">AVAILABLE FOR REMOTE WORK</text></g><g class="fin f1"><text x="152" y="88" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="21" font-weight="500" fill="#E8E9EC" text-anchor="start" letter-spacing="0.2">Contract  ·  fractional  ·  advisory</text></g><g class="cyc y0" opacity="1"><text x="152" y="120" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#9AA0A8" text-anchor="start">Ship or don't ship.</text></g><g class="cyc y1" opacity="0"><text x="152" y="120" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#9AA0A8" text-anchor="start">No pitch decks. No vapor.</text></g><g class="cyc y2" opacity="0"><text x="152" y="120" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#9AA0A8" text-anchor="start">It works. That's not the same as being good.</text></g><g class="cyc y3" opacity="0"><text x="152" y="120" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#9AA0A8" text-anchor="start">If in doubt: colder, sharper, quieter.</text></g><g class="fin f2"><text x="1160" y="52" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#D7D9DD" text-anchor="end" letter-spacing="0.4">ari@konkred.xyz</text><text x="1160" y="76" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#D98A2E" text-anchor="end" letter-spacing="0.4">konkred.xyz</text><line x1="1160" y1="92" x2="970" y2="92" stroke="#222B36" stroke-width="1"/><text x="1160" y="114" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#6B717A" text-anchor="end" letter-spacing="1.8">TIMEZONE FLEXIBLE  ·  ASYNC-FIRST</text></g><g class="fin f3"><line x1="36" y1="140" x2="1164" y2="140" stroke="#1A212B" stroke-width="1"/><text x="36" y="158" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#6B717A" text-anchor="start" letter-spacing="2.0">KONKRED — BRAND SYSTEM v2</text><text x="1164" y="158" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#6B717A" text-anchor="end" letter-spacing="1.4">VOID #0B0F14  ·  CLINICAL #D7D9DD  ·  SIGNAL #D98A2E</text></g></svg>