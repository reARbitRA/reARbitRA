<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" fill="none" role="img" aria-labelledby="t d"><title id="t">Contact</title><desc id="d">Footer with contact channels and brand voice.</desc><defs></defs><style>@media (prefers-reduced-motion: no-preference){
  .scanband  { animation: scanY 4s linear infinite; }
  .scanband2 { animation: scanY 4s linear infinite; opacity:.5; }
  @keyframes scanY { from { transform: translateY(0); } to { transform: translateY(300px); } }
  .kedge { animation: kglow 3.3s ease-in-out infinite; }
  @keyframes kglow { 0%,100% { opacity:.30; } 50% { opacity:.78; } }
  .trace { stroke-dasharray: 16 10; animation: drift 11.5s linear infinite; }
  @keyframes drift { to { stroke-dashoffset: -260; } }
  .sigdot { animation: sig 2.4s ease-in-out infinite; }
  @keyframes sig { 0%,100% { opacity:.35; } 50% { opacity:1; } }

  .fin { animation: fi .55s ease-out backwards; }
  @keyframes fi { from { opacity:0; transform: translateY(7px); }
                  to   { opacity:1; transform: translateY(0); } }
  .f0 { animation-delay:.06s } .f1 { animation-delay:.18s }
  .f2 { animation-delay:.30s } .f3 { animation-delay:.42s }
  .cube { animation: fi .6s ease-out .04s backwards; }
  .cyc { animation: cyc 16s linear infinite; }
  @keyframes cyc {
     0%   { opacity:0; transform: translateY(5px); }
     3%   { opacity:1; transform: translateY(0); }
    22%   { opacity:1; transform: translateY(0); }
    25%   { opacity:0; transform: translateY(-5px); }
   100%   { opacity:0; transform: translateY(-5px); } }
  .y0 { animation-delay:.6s } .y1 { animation-delay:4.6s }
  .y2 { animation-delay:8.6s } .y3 { animation-delay:12.6s }
}</style><rect width="1200" height="170" fill="#0B0F14"/><defs><pattern id="fg" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D7D9DD" stroke-width="1" opacity="0.02"/></pattern></defs><rect width="1200" height="170" fill="url(#fg)"/><rect x="0" y="0" width="1200" height="170" fill="none" stroke="#1A212B" stroke-width="1"/><line x1="12" y1="12" x2="22" y2="12" stroke="#D98A2E" stroke-width="1.1" opacity=".45"/><line x1="12" y1="12" x2="12" y2="22" stroke="#D98A2E" stroke-width="1.1" opacity=".45"/><line x1="1188" y1="12" x2="1178" y2="12" stroke="#D98A2E" stroke-width="1.1" opacity=".45"/><line x1="1188" y1="12" x2="1188" y2="22" stroke="#D98A2E" stroke-width="1.1" opacity=".45"/><line x1="12" y1="158" x2="22" y2="158" stroke="#D98A2E" stroke-width="1.1" opacity=".45"/><line x1="12" y1="158" x2="12" y2="148" stroke="#D98A2E" stroke-width="1.1" opacity=".45"/><line x1="1188" y1="158" x2="1178" y2="158" stroke="#D98A2E" stroke-width="1.1" opacity=".45"/><line x1="1188" y1="158" x2="1188" y2="148" stroke="#D98A2E" stroke-width="1.1" opacity=".45"/><defs><clipPath id="fkcut"><path d="M 116.02,115.75 L 129.88,107.75 L 129.88,134.75 L 151.96,95.00 L 169.72,84.75 L 143.30,135.00 L 171.45,153.75 L 153.00,164.40 L 129.88,149.25 L 129.88,177.75 L 116.02,185.75 Z"/></clipPath><clipPath id="fsil"><path d="M 100.00,10.00 L 186.60,60.00 L 186.60,160.00 L 100.00,210.00 L 13.40,160.00 L 13.40,60.00 Z"/></clipPath><linearGradient id="fscan" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D98A2E" stop-opacity="0"/><stop offset="50%" stop-color="#D98A2E" stop-opacity=".5"/><stop offset="100%" stop-color="#D98A2E" stop-opacity="0"/></linearGradient></defs><g transform="translate(36,38) scale(0.42)" class="cube"><path d="M 100.00,10.00 L 186.60,60.00 L 100.00,110.00 L 13.40,60.00 Z" fill="#E8E9EC"/><path d="M 13.40,60.00 L 100.00,110.00 L 100.00,210.00 L 13.40,160.00 Z" fill="#D7D9DD"/><path d="M 100.00,110.00 L 186.60,60