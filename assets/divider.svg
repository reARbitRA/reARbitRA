<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" fill="none" role="img" aria-labelledby="t d"><title id="t">Divider</title><desc id="d">Animated signal divider.</desc><defs></defs><style>@media (prefers-reduced-motion: no-preference){
  .seg { stroke-dasharray: 120 1080; animation: run 6s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -1200; } }
  .dot { animation: dp 2.4s ease-in-out infinite; }
  @keyframes dp { 0%,100% { opacity:.3 } 50% { opacity:1 } }
  .dtick { animation: dt 3.2s ease-in-out infinite; }
  @keyframes dt { 0%,100% { opacity:.25 } 50% { opacity:.9 } }
  .dpulse { animation: dpul 5s linear infinite; }
  @keyframes dpul { 0% { opacity:0; transform: translateX(0) }
                    10% { opacity:1 } 90% { opacity:1 }
                    100% { opacity:0; transform: translateX(1160px) } }
}</style><rect width="1200" height="26" fill="#0B0F14"/><line x1="0" y1="13" x2="1200" y2="13" stroke="#1A212B" stroke-width="1"/><line class="seg" x1="0" y1="13" x2="1200" y2="13" stroke="#D98A2E" stroke-width="1.6"/><rect class="dtick" x="24" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:0.00s"/><rect class="dtick" x="120" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:0.16s"/><rect class="dtick" x="216" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:0.32s"/><rect class="dtick" x="312" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:0.48s"/><rect class="dtick" x="408" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:0.64s"/><rect class="dtick" x="504" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:0.80s"/><rect class="dtick" x="600" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:0.96s"/><rect class="dtick" x="696" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:1.12s"/><rect class="dtick" x="792" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:1.28s"/><rect class="dtick" x="888" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:1.44s"/><rect class="dtick" x="984" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:1.60s"/><rect class="dtick" x="1080" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:1.76s"/><rect class="dtick" x="1176" y="10" width="2" height="6" fill="#6B717A" opacity=".5" style="animation-delay:1.92s"/><circle class="dot" cx="600.0" cy="13" r="3" fill="#D98A2E"/><rect class="dpulse" x="0" y="11.5" width="46" height="3" fill="#D98A2E" opacity=".7"/></svg>