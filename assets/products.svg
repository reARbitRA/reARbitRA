apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#9AA0A8" text-anchor="start">across legal, finance, engineering and heavy industry.</text><text x="24" y="162" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#9AA0A8" text-anchor="start">One input, concrete output. No configuration theatre.</text><rect x="24" y="170" width="540" height="1" fill="#1A212B"/><circle class="live" cx="29" cy="191" r="3.4" fill="#D98A2E"/><text x="42" y="195" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#6B717A" text-anchor="start" letter-spacing="1.1">micro-tools · enterprise prompts · multi-domain</text><text x="564" y="195" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="500" fill="#D98A2E" text-anchor="end" letter-spacing="2.2">LIVE</text></g><g class="card c2 p2" transform="translate(0,238)"><rect x="0" y="0" width="588" height="214" fill="#0E1319" stroke="#1A212B" stroke-width="1" rx="3"/><rect class="edge" x=".5" y=".5" width="587" height="213" fill="none" stroke="#D98A2E" stroke-width="1.4" rx="3" opacity=".75"/><path class="corner" d="M 566 1 L 587 1 L 587 22" fill="none" stroke="#D98A2E" stroke-width="2"/><g transform="translate(24,22) scale(1.15)" fill="none" stroke="#D7D9DD" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 2 L20 5.6 V11.2 C20 16.4 16.6 20.2 12 22 C7.4 20.2 4 16.4 4 11.2 V5.6 Z" /><path d="M12 9.4 A2 2 0 1 1 12 13.4 A2 2 0 1 1 12 9.4 M12 13.4 V16.6" /></g><text x="66" y="36" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#6B717A" text-anchor="start" letter-spacing="2.4">AI SECURITY</text><text x="66" y="58" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="600" fill="#E8E9EC" text-anchor="start" letter-spacing="-0.2">KONKRED Redeye</text><line x1="24" y1="86" x2="564" y2="86" stroke="#1A212B" stroke-width="1"/><text x="24" y="114" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#9AA0A8" text-anchor="start">Red teaming and AI security. Adversarial prompt testing,</text><text x="24" y="138" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#9AA0A8" text-anchor="start">jailbreak surface mapping, guardrail validation.</text><text x="24" y="162" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#9AA0A8" text-anchor="start">367 techniques catalogued and typed.</text><rect x="24" y="170" width="540" height="1" fill="#1A212B"/><circle class="live" cx="29" cy="191" r="3.4" fill="#D98A2E"/><text x="42" y="195" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#6B717A" text-anchor="start" letter-spacing="1.1">red team · adversarial · guardrails</text><text x="564" y="195" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="500" fill="#D98A2E" text-anchor="end" letter-spacing="2.2">LIVE</text></g><g class="card c3 p3" transform="translate(612,238)"><rect x="0" y="0" width="588" height="214" fill="#0E1319" stroke="#1A212B" stroke-width="1" rx="3"/><rect class="edge" x=".5" y=".5" width="587" height="213" fill="none" stroke="#D98A2E" stroke-width="1.4" rx="3" opacity=".75"/><path class="corner" d="M 566 1 L 587 1 L 587 22" fill="none" stroke="#D98A2E" stroke-width="2"/><g transform="translate(24,22) scale(1.15)" fill="none" stroke="#D7D9DD" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 2.6 H14.2 L18.6 7 V21.4 H6 Z" /><path d="M14.2 2.6 V7 H18.6" /><path d="M9 12.2 H15.6 M9 15.2 H15.6 M9 18.2 H13.2" /></g><text x="66" y="36" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#6B717A" text-anchor="start" letter-spacing="2.4">DOCUMENTATION</text><text x="66" y="58" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="600" fill="#E8E9EC" text-anchor="start" letter-spacing="-0.2">KONKRED Arbitra</text><line x1="24" y1="86" x2="564" y2="86" stroke="#1A212B" stroke-width="1"/><text x="24" y="114" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#9AA0A8" text-anchor="start">Build documentation from code, from prompts, from systems</text><text x="24" y="138" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#9AA0A8" text-anchor="start">that never had any. API references, runbooks, architecture</text><text x="24" y="162" font-family="Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#9AA0A8" text-anchor="start">notes — generated, verified, versioned.</text><rect x="24" y="170" width="540" height="1" fill="#1A212B"/><circle class="live" cx="29" cy="191" r="3.4" fill="#D98A2E"/><text x="42" y="195" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#6B717A" text-anchor="start" letter-spacing="1.1">docs · api refs · runbooks</text><text x="564" y="195" font-family="ui-monospace,'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="500" fill="#D98A2E" text-anchor="end" letter-spacing="2.2">LIVE</t